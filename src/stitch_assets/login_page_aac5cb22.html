<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Login | OpenInvertir - Premium Investment Platform</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#d4af35",
                        "background-light": "#f8f7f6",
                        "background-dark": "#12141d", // Deep navy/dark adjustment for premium feel
                    },
                    fontFamily: {
                        "display": ["Inter"]
                    },
                    borderRadius: {"DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem", "full": "9999px"},
                },
            },
        }
    </script>
<style>
        body {
            font-family: 'Inter', sans-serif;
        }
    </style>
</head>
<body class="bg-background-light dark:bg-background-dark text-slate-900 dark:text-slate-100 antialiased min-h-screen flex flex-col">
<div class="relative flex min-h-screen w-full flex-col overflow-x-hidden">
<div class="layout-container flex h-full grow flex-col">
<!-- Navigation Header -->
<header class="flex items-center justify-between whitespace-nowrap border-b border-slate-200 dark:border-slate-800 px-6 md:px-10 py-4 lg:px-40">
<div class="flex items-center gap-3">
<div class="size-8 text-primary">
<svg fill="none" viewbox="0 0 48 48" xmlns="http://www.w3.org/2000/svg">
<g clip-path="url(#clip0_6_535)">
<path clip-rule="evenodd" d="M47.2426 24L24 47.2426L0.757355 24L24 0.757355L47.2426 24ZM12.2426 21H35.7574L24 9.24264L12.2426 21Z" fill="currentColor" fill-rule="evenodd"></path>
</g>
<defs>
<clippath id="clip0_6_535"><rect fill="white" height="48" width="48"></rect></clippath>
</defs>
</svg>
</div>
<h2 class="text-slate-900 dark:text-white text-xl font-bold tracking-tight">OpenInvertir</h2>
</div>
<div class="flex items-center gap-4">
<span class="hidden md:inline text-sm text-slate-500 dark:text-slate-400">New to OpenInvertir?</span>
<button class="flex min-w-[100px] cursor-pointer items-center justify-center rounded-lg h-10 px-4 bg-primary text-background-dark text-sm font-bold transition-all hover:opacity-90">
                        Sign Up
                    </button>
</div>
</header>
<main class="flex-1 flex items-center justify-center px-4 py-12">
<div class="w-full max-w-[440px] flex flex-col">
<!-- Decorative Element -->
<div class="mb-8 text-center">
<div class="inline-flex items-center justify-center p-3 rounded-full bg-primary/10 mb-4">
<span class="material-symbols-outlined text-primary text-3xl">lock_open</span>
</div>
<h1 class="text-slate-900 dark:text-white text-3xl font-bold tracking-tight">Welcome Back</h1>
<p class="text-slate-500 dark:text-slate-400 mt-2">Secure access to your premium investments</p>
</div>
<!-- Login Form -->
<div class="bg-white dark:bg-slate-900/50 p-8 rounded-xl border border-slate-200 dark:border-slate-800 shadow-xl">
<form class="space-y-5">
<div>
<label class="block text-sm font-medium text-slate-700 dark:text-slate-300 mb-2">Email Address</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-slate-400 text-xl">mail</span>
<input class="w-full pl-11 pr-4 py-3 bg-slate-50 dark:bg-slate-800/50 border border-slate-200 dark:border-slate-700 rounded-lg focus:ring-2 focus:ring-primary/50 focus:border-primary outline-none transition-all dark:text-white" placeholder="name@investment.com" required="" type="email"/>
</div>
</div>
<div>
<div class="flex justify-between items-center mb-2">
<label class="block text-sm font-medium text-slate-700 dark:text-slate-300">Password</label>
<a class="text-xs font-semibold text-primary hover:underline" href="#">Forgot Password?</a>
</div>
<div class="relative">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-slate-400 text-xl">key</span>
<input class="w-full pl-11 pr-4 py-3 bg-slate-50 dark:bg-slate-800/50 border border-slate-200 dark:border-slate-700 rounded-lg focus:ring-2 focus:ring-primary/50 focus:border-primary outline-none transition-all dark:text-white" placeholder="••••••••" required="" type="password"/>
</div>
</div>
<div class="flex items-center gap-2 py-2">
<input class="rounded border-slate-300 dark:border-slate-700 text-primary focus:ring-primary bg-transparent" id="remember" type="checkbox"/>
<label class="text-sm text-slate-600 dark:text-slate-400" for="remember">Keep me logged in for 30 days</label>
</div>
<button class="w-full bg-primary text-background-dark font-bold py-3.5 rounded-lg hover:brightness-110 active:scale-[0.98] transition-all shadow-lg shadow-primary/20" type="submit">
                                Login to Account
                            </button>
</form>
<div class="mt-8 relative">
<div class="absolute inset-0 flex items-center">
<div class="w-full border-t border-slate-200 dark:border-slate-800"></div>
</div>
<div class="relative flex justify-center text-xs uppercase">
<span class="bg-white dark:bg-slate-900 px-2 text-slate-500">Security Certified</span>
</div>
</div>
<!-- Trust Badges -->
<div class="mt-6 flex justify-center gap-6 opacity-60 grayscale hover:grayscale-0 transition-all">
<span class="material-symbols-outlined text-slate-400" title="Secure Encryption">encrypted</span>
<span class="material-symbols-outlined text-slate-400" title="Verified Identity">verified_user</span>
<span class="material-symbols-outlined text-slate-400" title="24/7 Monitoring">monitoring</span>
</div>
</div>
<!-- Footer Links -->
<div class="mt-8 text-center space-y-4">
<p class="text-sm text-slate-500 dark:text-slate-400">
                            By continuing, you agree to OpenInvertir's 
                            <a class="text-primary hover:underline" href="#">Terms of Service</a> and 
                            <a class="text-primary hover:underline" href="#">Privacy Policy</a>.
                        </p>
</div>
</div>
</main>
<!-- Bottom Background Elements -->
<div class="fixed bottom-0 left-0 w-full h-1 bg-gradient-to-r from-transparent via-primary/30 to-transparent"></div>
</div>
</div>
</body></html>
