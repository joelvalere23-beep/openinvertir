<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;900&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#d4af35",
                        "background-light": "#f8f7f6",
                        "background-dark": "#201d12",
                    },
                    fontFamily: {
                        "display": ["Inter"]
                    },
                    borderRadius: {"DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem", "full": "9999px"},
                },
            },
        }
    </script>
<title>Sign Up | OpenInvertir</title>
</head>
<body class="bg-background-light dark:bg-background-dark font-display text-slate-900 dark:text-slate-100 antialiased">
<div class="relative flex min-h-screen w-full flex-col overflow-x-hidden">
<div class="layout-container flex h-full grow flex-col">
<!-- Header -->
<header class="flex items-center justify-between border-b border-primary/10 px-6 py-4 md:px-20 lg:px-40">
<div class="flex items-center gap-3">
<div class="text-primary">
<svg class="w-8 h-8" fill="none" viewbox="0 0 48 48" xmlns="http://www.w3.org/2000/svg">
<path clip-rule="evenodd" d="M47.2426 24L24 47.2426L0.757355 24L24 0.757355L47.2426 24ZM12.2426 21H35.7574L24 9.24264L12.2426 21Z" fill="currentColor" fill-rule="evenodd"></path>
</svg>
</div>
<h2 class="text-xl font-bold tracking-tight">OpenInvertir</h2>
</div>
<div class="flex items-center gap-4">
<span class="hidden md:inline text-slate-400 text-sm">Already have an account?</span>
<button class="flex min-w-[84px] cursor-pointer items-center justify-center rounded-lg h-10 px-5 border border-primary text-primary hover:bg-primary/10 transition-colors text-sm font-bold">
                        Log In
                    </button>
</div>
</header>
<main class="flex-1 flex items-center justify-center px-6 py-12">
<div class="w-full max-w-[480px] space-y-8">
<!-- Title Section -->
<div class="space-y-2">
<h1 class="text-4xl font-black tracking-tight text-slate-900 dark:text-white">Join OpenInvertir</h1>
<p class="text-slate-500 dark:text-primary/60 text-base">Start your premium investment journey today with institutional-grade security.</p>
</div>
<!-- Form Section -->
<form class="space-y-5">
<div class="space-y-2">
<label class="block text-sm font-semibold text-slate-700 dark:text-slate-200">Full Name</label>
<input class="w-full rounded-xl border border-slate-200 dark:border-primary/20 bg-white dark:bg-primary/5 p-4 text-base focus:border-primary focus:ring-1 focus:ring-primary outline-none transition-all placeholder:text-slate-400 dark:placeholder:text-slate-600" placeholder="Enter your full name" type="text"/>
</div>
<div class="space-y-2">
<label class="block text-sm font-semibold text-slate-700 dark:text-slate-200">Email Address</label>
<input class="w-full rounded-xl border border-slate-200 dark:border-primary/20 bg-white dark:bg-primary/5 p-4 text-base focus:border-primary focus:ring-1 focus:ring-primary outline-none transition-all placeholder:text-slate-400 dark:placeholder:text-slate-600" placeholder="name@example.com" type="email"/>
</div>
<div class="space-y-2">
<label class="block text-sm font-semibold text-slate-700 dark:text-slate-200">Password</label>
<div class="relative group">
<input class="w-full rounded-xl border border-slate-200 dark:border-primary/20 bg-white dark:bg-primary/5 p-4 pr-12 text-base focus:border-primary focus:ring-1 focus:ring-primary outline-none transition-all placeholder:text-slate-400 dark:placeholder:text-slate-600" placeholder="Create a strong password" type="password"/>
<button class="absolute right-4 top-1/2 -translate-y-1/2 text-slate-400 hover:text-primary transition-colors" type="button">
<span class="material-symbols-outlined">visibility</span>
</button>
</div>
</div>
<div class="pt-2">
<button class="w-full bg-primary hover:bg-primary/90 text-background-dark font-bold text-lg py-4 rounded-xl shadow-lg shadow-primary/20 transition-all flex items-center justify-center gap-2" type="submit">
                                Create Account
                                <span class="material-symbols-outlined">arrow_forward</span>
</button>
</div>
</form>
<!-- Trust Indicators -->
<div class="grid grid-cols-2 gap-4 py-6 border-t border-primary/10">
<div class="flex items-center gap-3">
<div class="flex h-10 w-10 items-center justify-center rounded-full bg-primary/10 text-primary">
<span class="material-symbols-outlined text-[20px]">shield_lock</span>
</div>
<div>
<p class="text-xs font-bold uppercase tracking-wider text-slate-400">Security</p>
<p class="text-sm font-semibold dark:text-slate-200">Bank-Grade SSL</p>
</div>
</div>
<div class="flex items-center gap-3">
<div class="flex h-10 w-10 items-center justify-center rounded-full bg-primary/10 text-primary">
<span class="material-symbols-outlined text-[20px]">verified_user</span>
</div>
<div>
<p class="text-xs font-bold uppercase tracking-wider text-slate-400">Compliance</p>
<p class="text-sm font-semibold dark:text-slate-200">GDPR Ready</p>
</div>
</div>
</div>
<!-- Footer Links -->
<div class="text-center space-y-4">
<p class="text-xs text-slate-500 leading-relaxed">
                            By signing up, you agree to our 
                            <a class="text-primary hover:underline font-medium" href="#">Terms of Service</a> 
                            and 
                            <a class="text-primary hover:underline font-medium" href="#">Privacy Policy</a>.
                        </p>
</div>
</div>
</main>
<!-- Decorative background elements -->
<div class="fixed top-0 right-0 -z-10 w-[500px] h-[500px] bg-primary/5 rounded-full blur-[120px] pointer-events-none"></div>
<div class="fixed bottom-0 left-0 -z-10 w-[300px] h-[300px] bg-primary/5 rounded-full blur-[100px] pointer-events-none"></div>
</div>
</div>
</body></html>
